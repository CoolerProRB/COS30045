<div>
    <h1>Design Studio Activity</h1>
    <div id="output">Loading document...</div>
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
    <script>
        console.log(location.host + location.pathname + "/docx/lab4.1.docx");
        const docxUrl = location.host + "/docx/lab4.1.docx";

        fetch(docxUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.arrayBuffer();
            })
            .then(arrayBuffer => {
                return mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
            })
            .then(result => {
                document.getElementById('output').innerHTML = result.value;
                if (result.messages.length) {
                    console.warn(result.messages);
                }
            })
            .catch(error => {
                console.error('Error loading document:', error);
                document.getElementById('output').textContent = 'Failed to load document.';
            });
    </script>
</div>
