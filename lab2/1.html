<div>
    <h1>The D3 Journey starts here...</h1>
    <div id="container"></div>
    <script>
        dataSet = [14, 5, 26, 23, 9]
        d3.select("#container")
            .selectAll("p")
            .data(dataSet)
            .enter()
            .append("p")
            .text(function (d, i) {
                if (d > 10) {
                    return `Waring: Joe watched ${d} cat videos today.`;
                } else {
                    return `Joe watched ${d} cat videos today.`;
                }
            })
            .style("color", function (d, i) {
                if (d > 10) {
                    return "red";
                } else {
                    return "white";
                }
            });
    </script>
</div>
