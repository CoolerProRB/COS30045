<div>
    <h1>Update and Transitions</h1>

    <div style="min-height: 80vh;">
        <div class="container">
            <span>Current Transition: <span id="current">1</span></span>
        </div>
        <br>
        <div class="container">
            <button class="btn-l-5-1">Update</button>
            <button class="btn-l-5-2" onclick="transition=d3.easeCubicInOut;currentTrans=1;document.getElementById('current').innerText = currentTrans">Transition 1</button>
            <button class="btn-l-5-3" onclick="transition=d3.easeElasticOut;currentTrans=2;document.getElementById('current').innerText = currentTrans">Transition 2</button>
        </div>
        <div class="container" style="margin-top: 2rem;">
            <div id="container"></div>
        </div>
    </div>
    <script src="js/lab5.2.js"></script>
</div>
